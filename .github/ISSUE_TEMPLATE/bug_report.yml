name: 🐛 Bug Report
description: Report a reproducible problem or crash in FixMySpine
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: FixMySpine Version
      placeholder: "e.g. 5.0.4"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS Version
      placeholder: "e.g. macOS 14.5 Sonoma (Apple Silicon M2)"
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Audio Device
      options:
        - AirPods Pro (2nd Gen)
        - AirPods Pro (1st Gen)
        - AirPods Max
        - AirPods (3rd Gen)
        - Beats Fit Pro
        - Other (please specify in description)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Connect AirPods Pro
        2. Launch FixMySpine
        3. Click 'Calibrate'
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What should happen under normal operation.
    validations:
      required: true
