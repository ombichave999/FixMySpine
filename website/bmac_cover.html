<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixMySpine — Buy Me a Coffee Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800;850;900&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      width: 1600px;
      height: 600px;
      overflow: hidden;
      background: #090a0d;
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 100px;
      position: relative;
    }

    /* Ambient Lighting */
    .glow-top {
      position: absolute;
      top: -150px;
      left: 20%;
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 208, 83, 0.22) 0%, transparent 70%);
      pointer-events: none;
    }

    .glow-right {
      position: absolute;
      bottom: -100px;
      right: 5%;
      width: 500px;
      height: 450px;
      background: radial-gradient(circle, rgba(0, 208, 83, 0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Blueprint Grid */
    .grid-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Left Content Column */
    .left-col {
      position: relative;
      z-index: 5;
      max-width: 820px;
      display: flex;
      flex-direction: column;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .app-icon {
      width: 52px;
      height: 52px;
      border-radius: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .brand-title {
      font-size: 28px;
      font-weight: 850;
      letter-spacing: -0.03em;
      color: #ffffff;
    }

    .brand-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      background: rgba(0, 208, 83, 0.15);
      color: #00d053;
      border: 1px solid rgba(0, 208, 83, 0.35);
      padding: 6px 14px;
      border-radius: 100px;
      letter-spacing: 0.06em;
    }

    .hero-title {
      font-size: 56px;
      font-weight: 850;
      line-height: 1.05;
      letter-spacing: -0.04em;
      margin-bottom: 18px;
    }

    .hero-title span.italic {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic;
      font-weight: 500;
      color: #00d053;
    }

    .hero-sub {
      font-size: 21px;
      line-height: 1.45;
      color: #8c8e9e;
      font-weight: 500;
      letter-spacing: -0.015em;
      margin-bottom: 28px;
      max-width: 720px;
    }

    .badges-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 16px;
      border-radius: 100px;
      color: #d0d2df;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00d053;
      box-shadow: 0 0 8px #00d053;
    }

    /* Right Visual Stage */
    .right-stage {
      position: relative;
      z-index: 5;
      width: 520px;
      height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radar-circle {
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.12);
    }

    .radar-circle-inner {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 208, 83, 0.3);
    }

    .airpod-img {
      width: 240px;
      height: auto;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 24px 48px rgba(0, 208, 83, 0.28)) drop-shadow(0 12px 24px rgba(0, 0, 0, 0.9));
      transform: translateY(-8px);
    }

    .telemetry-tag {
      position: absolute;
      bottom: 48px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(18, 20, 26, 0.94);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(0, 208, 83, 0.5);
      padding: 9px 20px;
      border-radius: 100px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 24px rgba(0, 208, 83, 0.2);
      font-family: 'JetBrains Mono', monospace;
    }

    .tt-deg {
      font-size: 17px;
      font-weight: 800;
      color: #00d053;
    }

    .tt-status {
      font-size: 11px;
      font-weight: 700;
      background: rgba(0, 208, 83, 0.15);
      color: #00d053;
      padding: 3px 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="glow-top"></div>
  <div class="glow-right"></div>
  <div class="grid-bg"></div>

  <div class="left-col">
    <div class="brand-row">
      <img src="frontend/AppIcon.png" alt="FixMySpine Icon" class="app-icon" />
      <span class="brand-title">FixMySpine</span>
      <span class="brand-tag">● 100% FREE &amp; OPEN SOURCE</span>
    </div>

    <h1 class="hero-title">
      Posture intelligence,<br />
      powered by <span class="italic">AirPods.</span>
    </h1>

    <p class="hero-sub">
      A lightweight, native macOS menu bar app using 60Hz CoreMotion gyroscopes to correct posture in real-time. Zero cameras, zero battery drain.
    </p>

    <div class="badges-row">
      <div class="chip"><span class="dot"></span> Swift 6 Native</div>
      <div class="chip"><span class="dot"></span> 100% Offline</div>
      <div class="chip"><span class="dot"></span> GitHub FOSS</div>
    </div>
  </div>

  <div class="right-stage">
    <div class="radar-circle"></div>
    <div class="radar-circle-inner"></div>
    <img src="frontend/assets/img/airpod-1.png" alt="AirPods Pro" class="airpod-img" />
    <div class="telemetry-tag">
      <span style="font-size: 11px; color: #888998;">COREMOTION</span>
      <span class="tt-deg">0.8°</span>
      <span class="tt-status">ALIGNED</span>
    </div>
  </div>
</body>
</html>
